<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PitchPulse — Icon Refinements</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0f0ec; font-family: 'Space Grotesk', sans-serif; padding: 48px 32px; }

    h1 { text-align: center; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #999; margin-bottom: 48px; }

    .row { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; max-width: 900px; margin: 0 auto 56px; }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .label {
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #aaa;
      text-align: center;
    }

    .sizes {
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }

    /* wordmark pairings */
    .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 34px;
      letter-spacing: -0.5px;
      color: #1a1a2e;
    }
    .wordmark .p { font-weight: 400; }
    .wordmark .P { font-weight: 700; color: #00c896; }

    .divider {
      width: 100%;
      max-width: 700px;
      margin: 0 auto 48px;
      border: none;
      border-top: 1px solid #ddd;
    }

    h2 { text-align: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #bbb; margin-bottom: 40px; }
  </style>
</head>
<body>

<h1>PitchPulse · Icon Refinements</h1>

<div class="row">

  <!-- ══════════════════════════════════ -->
  <!-- ICON A: P where pulse exits the bowl -->
  <!-- The stem of P flows into a clean ECG line -->
  <!-- ══════════════════════════════════ -->
  <div class="item">
    <div class="label">A — Pulse exits the stem</div>
    <div class="sizes">
      <!-- 96px -->
      <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <!-- Bold geometric P -->
        <!-- Stem -->
        <rect x="18" y="18" width="11" height="60" rx="2" fill="white"/>
        <!-- Bowl: large semi-circle on right of stem top -->
        <path d="M 29 18 L 52 18 Q 70 18 70 36 Q 70 54 52 54 L 29 54"
              fill="none" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Pulse line emerging from bottom-right of bowl, going right -->
        <!-- starts from roughly where the bowl ends (right side, mid) -->
        <polyline points="44,72 50,72 55,56 61,82 66,64 71,72 78,72"
          fill="none" stroke="#00c896" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- glowing dot at peak -->
        <circle cx="61" cy="82" r="0" fill="#00c896"/>
      </svg>

      <!-- 64px -->
      <svg width="64" height="64" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <rect x="18" y="18" width="11" height="60" rx="2" fill="white"/>
        <path d="M 29 18 L 52 18 Q 70 18 70 36 Q 70 54 52 54 L 29 54"
              fill="none" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="44,72 50,72 55,56 61,82 66,64 71,72 78,72"
          fill="none" stroke="#00c896" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <!-- 40px -->
      <svg width="40" height="40" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <rect x="18" y="18" width="11" height="60" rx="2" fill="white"/>
        <path d="M 29 18 L 52 18 Q 70 18 70 36 Q 70 54 52 54 L 29 54"
              fill="none" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="44,72 50,72 55,56 61,82 66,64 71,72 78,72"
          fill="none" stroke="#00c896" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- ══════════════════════════════════ -->
  <!-- ICON B: P bowl IS the pulse arc   -->
  <!-- The right side of the P bowl is replaced by an ECG spike -->
  <!-- ══════════════════════════════════ -->
  <div class="item">
    <div class="label">B — Bowl becomes the pulse</div>
    <div class="sizes">
      <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <!-- Stem -->
        <rect x="16" y="16" width="12" height="64" rx="3" fill="white"/>
        <!-- Top of bowl (white) -->
        <line x1="28" y1="22" x2="52" y2="22" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <!-- Bottom of bowl (white) -->
        <line x1="28" y1="50" x2="48" y2="50" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <!-- Right side of bowl = pulse spike (green) -->
        <!-- from top-right (52,22) swoops right then spikes then comes back to (48,50) -->
        <path d="M 52 22 Q 62 22 64 30 L 58 36 L 72 24 L 64 46 L 60 40 Q 58 50 48 50"
              fill="none" stroke="#00c896" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <svg width="64" height="64" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <rect x="16" y="16" width="12" height="64" rx="3" fill="white"/>
        <line x1="28" y1="22" x2="52" y2="22" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <line x1="28" y1="50" x2="48" y2="50" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <path d="M 52 22 Q 62 22 64 30 L 58 36 L 72 24 L 64 46 L 60 40 Q 58 50 48 50"
              fill="none" stroke="#00c896" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <svg width="40" height="40" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <rect x="16" y="16" width="12" height="64" rx="3" fill="white"/>
        <line x1="28" y1="22" x2="52" y2="22" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <line x1="28" y1="50" x2="48" y2="50" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <path d="M 52 22 Q 62 22 64 30 L 58 36 L 72 24 L 64 46 L 60 40 Q 58 50 48 50"
              fill="none" stroke="#00c896" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- ══════════════════════════════════ -->
  <!-- ICON C: Clean P + horizontal pulse bar -->
  <!-- P takes top 60%, pulse runs full width bottom -->
  <!-- ══════════════════════════════════ -->
  <div class="item">
    <div class="label">C — P above, pulse bar below</div>
    <div class="sizes">
      <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <!-- Large clean P, centred, upper portion -->
        <rect x="22" y="14" width="10" height="52" rx="3" fill="white"/>
        <path d="M 32 14 L 54 14 Q 68 14 68 30 Q 68 46 54 46 L 32 46"
              fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Pulse bar bottom — full width strip -->
        <polyline points="12,78 22,78 28,66 34,86 40,72 46,78 84,78"
          fill="none" stroke="#00c896" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <svg width="64" height="64" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <rect x="22" y="14" width="10" height="52" rx="3" fill="white"/>
        <path d="M 32 14 L 54 14 Q 68 14 68 30 Q 68 46 54 46 L 32 46"
              fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="12,78 22,78 28,66 34,86 40,72 46,78 84,78"
          fill="none" stroke="#00c896" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <svg width="40" height="40" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <rect x="22" y="14" width="10" height="52" rx="3" fill="white"/>
        <path d="M 32 14 L 54 14 Q 68 14 68 30 Q 68 46 54 46 L 32 46"
              fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="12,78 22,78 28,66 34,86 40,72 46,78 84,78"
          fill="none" stroke="#00c896" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- ══════════════════════════════════ -->
  <!-- ICON D: Negative space P with pulse -->
  <!-- Full green background, P as white negative space, pulse in navy -->
  <!-- ══════════════════════════════════ -->
  <div class="item">
    <div class="label">D — Inverted / green fill</div>
    <div class="sizes">
      <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#00c896"/>
        <!-- P in navy -->
        <rect x="20" y="16" width="11" height="64" rx="3" fill="#1a1a2e"/>
        <path d="M 31 16 L 54 16 Q 70 16 70 34 Q 70 52 54 52 L 31 52"
              fill="none" stroke="#1a1a2e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Pulse in white -->
        <polyline points="44,74 50,74 54,62 60,82 65,68 70,74 78,74"
          fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <svg width="64" height="64" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#00c896"/>
        <rect x="20" y="16" width="11" height="64" rx="3" fill="#1a1a2e"/>
        <path d="M 31 16 L 54 16 Q 70 16 70 34 Q 70 52 54 52 L 31 52"
              fill="none" stroke="#1a1a2e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="44,74 50,74 54,62 60,82 65,68 70,74 78,74"
          fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <svg width="40" height="40" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="#00c896"/>
        <rect x="20" y="16" width="11" height="64" rx="3" fill="#1a1a2e"/>
        <path d="M 31 16 L 54 16 Q 70 16 70 34 Q 70 52 54 52 L 31 52"
              fill="none" stroke="#1a1a2e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="44,74 50,74 54,62 60,82 65,68 70,74 78,74"
          fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

</div>

<hr class="divider"/>
<h2>Paired with wordmark</h2>

<!-- All four paired with the typography -->
<div class="row">

  <div class="item">
    <div class="label">A</div>
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="52" height="52" viewBox="0 0 96 96" fill="none">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <rect x="18" y="18" width="11" height="60" rx="2" fill="white"/>
        <path d="M 29 18 L 52 18 Q 70 18 70 36 Q 70 54 52 54 L 29 54"
              fill="none" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="44,72 50,72 55,56 61,82 66,64 71,72 78,72"
          fill="none" stroke="#00c896" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="wordmark"><span class="p">pitch</span><span class="P">Pulse</span></div>
    </div>
  </div>

  <div class="item">
    <div class="label">B</div>
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="52" height="52" viewBox="0 0 96 96" fill="none">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <rect x="16" y="16" width="12" height="64" rx="3" fill="white"/>
        <line x1="28" y1="22" x2="52" y2="22" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <line x1="28" y1="50" x2="48" y2="50" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <path d="M 52 22 Q 62 22 64 30 L 58 36 L 72 24 L 64 46 L 60 40 Q 58 50 48 50"
              fill="none" stroke="#00c896" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="wordmark"><span class="p">pitch</span><span class="P">Pulse</span></div>
    </div>
  </div>

  <div class="item">
    <div class="label">C</div>
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="52" height="52" viewBox="0 0 96 96" fill="none">
        <rect width="96" height="96" rx="24" fill="#1a1a2e"/>
        <rect x="22" y="14" width="10" height="52" rx="3" fill="white"/>
        <path d="M 32 14 L 54 14 Q 68 14 68 30 Q 68 46 54 46 L 32 46"
              fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="12,78 22,78 28,66 34,86 40,72 46,78 84,78"
          fill="none" stroke="#00c896" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="wordmark"><span class="p">pitch</span><span class="P">Pulse</span></div>
    </div>
  </div>

  <div class="item">
    <div class="label">D</div>
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="52" height="52" viewBox="0 0 96 96" fill="none">
        <rect width="96" height="96" rx="24" fill="#00c896"/>
        <rect x="20" y="16" width="11" height="64" rx="3" fill="#1a1a2e"/>
        <path d="M 31 16 L 54 16 Q 70 16 70 34 Q 70 52 54 52 L 31 52"
              fill="none" stroke="#1a1a2e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="44,74 50,74 54,62 60,82 65,68 70,74 78,74"
          fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="wordmark"><span class="p">pitch</span><span class="P">Pulse</span></div>
    </div>
  </div>

</div>

<p style="text-align:center;margin-top:16px;font-size:11px;color:#bbb;letter-spacing:.05em;">
  Each shown at 96 · 64 · 40px — the sizes you'd use as app icon, nav logo, favicon
</p>

</body>
</html>
